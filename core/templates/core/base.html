<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>
         {%block title%}
         e-commerce
        {%endblock%}
    </title>
</head>
<body>
    <nav class="flex flex-row py-6 px-6 justify-between items-center border-b border-gray-200">
        <a href="/" class="text-xl font-semibold">E-commerce</a>

        <div class="space-x-6">
            <a class="text-lg font-semibold hover:text-gray-500" href="{% url 'item:new' %}">New Item</a>
            <a class="text-lg font-semibold hover:text-gray-500" href="#">Browse</a>

           
         

            {%if request.user.is_authenticated%}
                <a href="#" class="px-6 py-3 text-lg font-semibold bg-teal-500 text-white rounded-xl hover:bg-teal-700">Inbox</a>
                <a href="{% url 'dashboard:index' %}" class="px-6 py-3 text-lg font-semibold bg-gray-500 text-white rounded-xl hover:bg-teal-700">Dashboard</a>
                <form action="{%url 'logout' %}" style="display: inline" method="post">
                {%csrf_token%}
                <button type="submit" class="px-6 py-3 text-lg font-semibold bg-red-500 text-white rounded-xl hover:bg-red-700">Logout</button>
                </form>
            {%else%}
               <a href="{%url 'core:signup'%}" class="px-6 py-3 text-lg font-semibold bg-teal-500 text-white rounded-xl hover:bg-teal-700">Sign up</a>
                <a href="{%url 'core:login'%}" class="px-6 py-3 text-lg font-semibold bg-gray-500 text-white rounded-xl hover:bg-gray-700">Log in</a>
            {%endif%}
        </div>
        
    
        
    </nav>
    {%block content%}
    {%endblock%}

    <footer class="py-6 px-6 justify-between bg-gray-800">
            <div class="pr-10">
                <h3 class="space-x-6 font-semibold text-gray-400">About</h3>
                

                <p class="text-lg text-gray-500">Puddle Online Shopping </p>
            </div>


            
                <h3 class="mb-5 font-semibold text-gray-400">Menu</h3>


                <ul class="space-y-2">
                    <li><a href="#" class="text-lg text-teal-500 hover:text-teal-700">About</a></li>
                    <li><a href="{}" class="text-lg text-teal-500 hover:text-teal-700">Contact</a></li>
                    <li><a href="#" class="text-lg text-teal-500 hover:text-teal-700">Privacy policy</a></li>
                    <li><a href="#" class="text-lg text-teal-500 hover:text-teal-700">Term of use</a></li>
                </ul>
            </div>

        </footer>
</body>
</html>
