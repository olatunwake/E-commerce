{%extends 'core/base.html'%}
{%block title%} New Item{%endblock%}

{%block content%}
<h1 class="mb-6">new item</h1>
<form action="." method="post" enctype="">
    {%csrf_token%}

    <div class="space-y-4">{{form.as_p}}</div>


        {% if form.errors or form.non_field_errors %}
        <div class="mb-3 p-6 bg-red-100 rounded-b-xl"></div>
                {%for field in form%}
                {{field.errors}}  
                {%endfor%}

                {{form.non_field_errors}}
            </div>
            {%endif%}

                <button class="py-4 px-8 text-lg bg-teal-500 hover:bg-teal-700 rounded-xl 
                    text-white">Submit</button>
    </form>
</div>


{%endblock%}
